<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RevLens — SaaS Revenue & Financial Intelligence</title>
    <meta name="description" content="Interactive SaaS revenue metrics, MRR forecasts, pricing simulations, and break-even intelligence.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RevLens">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0B0F19">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --outer-bg: radial-gradient(ellipse at 50% 35%, #222634 0%, #13151c 70%, #0a0b0e 100%);
            --app-shadow: 0 0 50px rgba(0, 0, 0, 0.7), -1px 0 0 rgba(255, 255, 255, 0.08), 1px 0 0 rgba(255, 255, 255, 0.08);
            --app-bg: #0B0F19;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --outer-bg: radial-gradient(ellipse at 50% 35%, #222634 0%, #13151c 70%, #0a0b0e 100%);
                --app-shadow: 0 0 50px rgba(0, 0, 0, 0.7), -1px 0 0 rgba(255, 255, 255, 0.08), 1px 0 0 rgba(255, 255, 255, 0.08);
            }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --outer-bg: radial-gradient(ellipse at 50% 35%, #edf1f8 0%, #dbe2ef 70%, #cbd5e1 100%);
                --app-shadow: 0 0 40px rgba(15, 23, 42, 0.16), -1px 0 0 rgba(0, 0, 0, 0.08), 1px 0 0 rgba(0, 0, 0, 0.08);
            }
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--outer-bg);
            display: flex;
            justify-content: center;
            align-items: stretch;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #F8FAFC;
        }
        #root {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            display: flex;
            position: relative;
            background-color: var(--app-bg);
            border-radius: 0;
            box-shadow: var(--app-shadow);
            overflow: hidden;
        }
        #root canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        @media (max-width: 412px) {
            #root {
                max-width: 100vw;
                box-shadow: none;
            }
        }
        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            font-family: inherit;
            color: #94A3B8;
            font-size: 14px;
            letter-spacing: 0.05em;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-spinner">
        <div class="spinner"></div>
        <div>Loading RevLens WebAssembly...</div>
    </div>
    <div id="root"></div>
    <script>
        window.addEventListener('error', function(e) {
            console.error('RevLens Runtime Error:', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error('RevLens Unhandled Rejection:', e.reason);
        });
        window.addEventListener('load', () => {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) {
                setTimeout(() => {
                    spinner.style.opacity = '0';
                    setTimeout(() => spinner.remove(), 400);
                }, 800);
            }
        });
    </script>
    <script src="revlens.js"></script>
</body>
</html>
