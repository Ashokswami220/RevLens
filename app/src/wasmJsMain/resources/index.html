<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
          name="viewport">
    <title>RevLens — SaaS Revenue & Financial Intelligence</title>
    <meta content="Interactive SaaS revenue metrics, MRR forecasts, pricing simulations, and break-even intelligence."
          name="description">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="RevLens" name="apple-mobile-web-app-title">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="#0B0F19" name="theme-color">
    <link href="manifest.json" rel="manifest">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
          rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --outer-bg: radial-gradient(ellipse at 50% 35%, #222634 0%, #13151c 70%, #0a0b0e 100%);
            --app-shadow: 0 0 50px rgba(0, 0, 0, 0.7), -1px 0 0 rgba(255, 255, 255, 0.08), 1px 0 0 rgba(255, 255, 255, 0.08);
            --app-bg: #0B0F19;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --outer-bg: radial-gradient(ellipse at 50% 35%, #222634 0%, #13151c 70%, #0a0b0e 100%);
                --app-shadow: 0 0 50px rgba(0, 0, 0, 0.7), -1px 0 0 rgba(255, 255, 255, 0.08), 1px 0 0 rgba(255, 255, 255, 0.08);
            }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --outer-bg: radial-gradient(ellipse at 50% 35%, #edf1f8 0%, #dbe2ef 70%, #cbd5e1 100%);
                --app-shadow: 0 0 40px rgba(15, 23, 42, 0.16), -1px 0 0 rgba(0, 0, 0, 0.08), 1px 0 0 rgba(0, 0, 0, 0.08);
            }
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--outer-bg);
            display: flex;
            justify-content: center;
            align-items: stretch;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #F8FAFC;
        }
        #root {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            display: flex;
            position: relative;
            background-color: var(--app-bg);
            border-radius: 0;
            box-shadow: var(--app-shadow);
            overflow: hidden;
        }
        #root canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        @media (max-width: 412px) {
            #root {
                max-width: 100vw;
                box-shadow: none;
            }
        }
        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            font-family: inherit;
            color: #94A3B8;
            font-size: 14px;
            letter-spacing: 0.05em;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="loading-spinner">
    <div class="spinner"></div>
    <div>Loading RevLens WebAssembly...</div>
</div>
<div id="root"></div>

<!-- Firebase Web SDK (compat for reliable cross-browser wasmJs interop) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTNJ_gJpSNgwrARgt7XwpxiMMmwL-ppTI",
        authDomain: "revlens-f80b1.firebaseapp.com",
        projectId: "revlens-f80b1",
        storageBucket: "revlens-f80b1.firebasestorage.app",
        messagingSenderId: "512497569694",
        appId: "1:512497569694:web:9f672111897a20cbb7d08f",
        measurementId: "G-3KDW1TRRCP"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    window.revlensFirebase = {
        authStatus: 'idle',
        lastAuthResultJson: null,
        lastAuthError: null,
        triggerGoogleSignIn: function() {
            window.revlensFirebase.authStatus = 'pending';
            window.revlensFirebase.lastAuthError = null;
            window.revlensFirebase.lastAuthResultJson = null;
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('profile');
            provider.addScope('email');
            firebase.auth().signInWithPopup(provider).then(result => {
                const user = result.user;
                window.revlensFirebase.lastAuthResultJson = JSON.stringify({
                    id: user.uid,
                    name: user.displayName || user.email || 'User',
                    email: user.email || '',
                    emailVerified: user.emailVerified || false,
                    avatarUrl: user.photoURL || null
                });
                window.revlensFirebase.authStatus = 'success';
            }).catch(err => {
                window.revlensFirebase.lastAuthError = err ? (err.message || String(err)) : 'Google sign-in cancelled or failed';
                window.revlensFirebase.authStatus = 'error';
            });
        },
        triggerSignOut: function() {
            return firebase.auth().signOut().then(() => {
                window.revlensFirebase.authStatus = 'idle';
                window.revlensFirebase.lastAuthResultJson = null;
            });
        },
        getCurrentUserJson: function() {
            const user = firebase.auth().currentUser;
            if (!user) return null;
            return JSON.stringify({
                id: user.uid,
                name: user.displayName || user.email || 'User',
                email: user.email || '',
                emailVerified: user.emailVerified || false,
                avatarUrl: user.photoURL || null
            });
        },
        updateProfile: function(name) {
            const user = firebase.auth().currentUser;
            if (!user) return Promise.resolve();
            return user.updateProfile({ displayName: name });
        },
        deleteAccount: function() {
            const user = firebase.auth().currentUser;
            if (!user) return Promise.resolve();
            return user.delete();
        },
        saveDoc: function(collection, docId, jsonStr) {
            const db = firebase.firestore();
            const data = JSON.parse(jsonStr);
            return db.collection(collection).doc(docId).set(data, { merge: true });
        },
        getDoc: function(collection, docId) {
            const db = firebase.firestore();
            return db.collection(collection).doc(docId).get().then(doc => {
                if (!doc.exists) return null;
                return JSON.stringify(doc.data());
            });
        },
        deleteDoc: function(collection, docId) {
            const db = firebase.firestore();
            return db.collection(collection).doc(docId).delete();
        }
    };

    window.addEventListener('error', function(e) {
        console.error('RevLens Runtime Error:', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
        console.error('RevLens Unhandled Rejection:', e.reason);
    });
    window.addEventListener('load', () => {
        const spinner = document.getElementById('loading-spinner');
        if (spinner) {
            setTimeout(() => {
                spinner.style.opacity = '0';
                setTimeout(() => spinner.remove(), 400);
            }, 800);
        }
    });
</script>
<script src="revlens.js"></script>
</body>
</html>
