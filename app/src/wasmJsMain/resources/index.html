<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RevLens — SaaS Revenue & Financial Intelligence</title>
    <meta name="description" content="Interactive SaaS revenue metrics, MRR forecasts, pricing simulations, and break-even intelligence.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0B0F19;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #F8FAFC;
        }
        #root {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            font-family: inherit;
            color: #94A3B8;
            font-size: 14px;
            letter-spacing: 0.05em;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-spinner">
        <div class="spinner"></div>
        <div>Loading RevLens WebAssembly...</div>
    </div>
    <canvas id="root"></canvas>
    <script>
        window.addEventListener('load', () => {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) {
                setTimeout(() => {
                    spinner.style.opacity = '0';
                    setTimeout(() => spinner.remove(), 400);
                }, 800);
            }
        });
    </script>
    <script src="revlens.js"></script>
</body>
</html>
